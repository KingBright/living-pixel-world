[workspace]
members = [
    "crates/sim_core",
    "crates/world_model",
    "crates/worldgen",
    "crates/world_headless",
    "crates/hydrology",
    "crates/simulation",
    "crates/world_runtime",
    "crates/world_view",
    "crates/world_cli",
]
exclude = ["apps/world_client"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Living Pixel World contributors"]
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
